# Деплой на DigitalOcean Droplet по SSH после успешного CI на main.
#
# Secrets (Settings → Secrets and variables → Actions):
#   DO_SSH_HOST, DO_SSH_USER, DO_SSH_PRIVATE_KEY — SSH на дроплет
#   DO_APP_DIR (опционально) — каталог клона, по умолчанию /opt/vodovorot-bot
#
# На дроплете: git clone + deploy key (read) в репозитории — см. docs/DEPLOY.md

name: Deploy DigitalOcean

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: digitalocean-deploy-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip when SSH secrets are not configured
        id: gate
        env:
          SSH_HOST: ${{ secrets.DO_SSH_HOST }}
          SSH_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "DO_SSH_HOST or DO_SSH_PRIVATE_KEY is empty — skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.gate.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_DIR: ${{ secrets.DO_APP_DIR }}
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          envs: APP_DIR
          command_timeout: 25m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/opt/vodovorot-bot}"
            export GIT_SSH_COMMAND='ssh -i /root/.ssh/github_deploy -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes'
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Missing git repo at $APP_DIR — clone once on the droplet (see docs/DEPLOY.md)"
              exit 1
            fi
            cd "$APP_DIR"
            git remote -v
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose up -d --build
            docker compose ps
