# Деплой на DigitalOcean Droplet по SSH после успешного CI на main.
#
# Secrets (Settings → Secrets and variables → Actions):
#   DO_SSH_HOST, DO_SSH_USER, DO_SSH_PRIVATE_KEY — SSH на дроплет
#   DO_APP_DIR (опционально) — каталог клона, по умолчанию /opt/vodovorot-bot
#
# На дроплете: git clone + deploy key (read) в репозитории — см. docs/DEPLOY.md

name: Deploy DigitalOcean

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: digitalocean-deploy-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip when SSH secrets are not configured
        id: gate
        env:
          SSH_HOST: ${{ secrets.DO_SSH_HOST }}
          SSH_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.DO_SSH_USER }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ] || [ -z "$SSH_USER" ]; then
            echo "DO_SSH_HOST, DO_SSH_USER or DO_SSH_PRIVATE_KEY is empty — skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif ! printf '%s' "$SSH_KEY" | grep -q 'BEGIN.*PRIVATE KEY'; then
            echo "DO_SSH_PRIVATE_KEY must be a full OpenSSH/PEM private key (see docs/DEPLOY.md)."
            exit 1
          fi

      - name: Prepare SSH key file
        if: steps.gate.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/do_deploy_key
          chmod 600 ~/.ssh/do_deploy_key
          ssh-keygen -y -f ~/.ssh/do_deploy_key > /dev/null

      - name: Deploy over SSH
        if: steps.gate.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_DIR: ${{ secrets.DO_APP_DIR }}
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key_path: ~/.ssh/do_deploy_key
          port: 22
          envs: APP_DIR
          command_timeout: 25m
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/opt/vodovorot-bot}"
            export GIT_SSH_COMMAND='ssh -i /root/.ssh/github_deploy -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes'
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Missing git repo at $APP_DIR — clone once on the droplet (see docs/DEPLOY.md)"
              exit 1
            fi
            cd "$APP_DIR"
            git remote -v
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            if ! swapon --show | grep -q /swapfile; then
              fallocate -l 2G /swapfile
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile
              grep -q swapfile /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
            fi
            docker compose up -d --build
            docker compose ps
