# Прод на VPS (DigitalOcean Droplet): docker compose up -d --build
# Mini App с HTTPS: задайте WEBAPP_DOMAIN + ACME_EMAIL в .env, затем
#   COMPOSE_PROFILES=webapp docker compose up -d --build
# См. docs/DEPLOY.md и deploy/Caddyfile.

services:
  bot:
    build: .
    image: vodovorot-bot:local
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - vodovorot-data:/app/data
    expose:
      - '8080'
    ports:
      - '127.0.0.1:${WEBAPP_PORT:-8080}:8080'

  caddy:
    profiles:
      - webapp
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - bot
    env_file:
      - .env
    environment:
      WEBAPP_DOMAIN: ${WEBAPP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  vodovorot-data:
  caddy_data:
  caddy_config:
